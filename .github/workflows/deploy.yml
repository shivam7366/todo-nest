name: Deploy to AWS

on:
  push:
    branches:
      - main # Trigger only on push to main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/task-api  # Make sure this matches your folder name on EC2
            git pull origin main
            npm install
            npm run build
            pm2 restart task-api || pm2 start dist/main.js --name task-api
